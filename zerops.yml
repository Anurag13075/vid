zerops:
  - setup: nodejs
    build:
      base: nodejs@22
      prepareCommands:
        - corepack enable
        - corepack prepare pnpm@9.15.5 --activate
      buildCommands:
        - pnpm install
        - pnpm run build
      deployFiles:
        - dist
        - server
        - data
        - node_modules
        - package.json
        - tsconfig.json
    run:
      base: nodejs@22
      prepareCommands:
        - sudo apk update
        - sudo apk add --no-cache ffmpeg ttf-dejavu py3-pip python3
        - sudo pip install --no-cache-dir edge-tts --break-system-packages
      ports:
        - port: 5000
          httpSupport: true
      envVariables:
        PORT: 5000
        NODE_ENV: production
