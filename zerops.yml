zerops:
  - setup: nodejs
    build:
      base: nodejs@22
      prepareCommands:
        - corepack enable
        - corepack prepare pnpm@9.15.5 --activate
      buildCommands:
        - pnpm install
        - pnpm run build
      deployFiles:
        - dist
        - server
        - data
        - node_modules
        - package.json
        - tsconfig.json
    run:
      base: nodejs@22
      prepareCommands:
        - sudo apk update
        - sudo apk add --no-cache ffmpeg ttf-dejavu
      ports:
        - port: 5000
          httpSupport: true
      envVariables:
        PORT: 5000
        NODE_ENV: production
        PEXELS_API_KEY: sYsJWjfNBleX61WYAZfRlenvWr1z2UkP7LlbieI9igmsX1k7Tv8yD27G
        PIXABAY_API_KEY: 56217573-a9df706c6c543d52b87c2dcb4
      start: npx tsx server/prod.ts
